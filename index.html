<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Rose Bouquet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #1f0816 0%, #0d0208 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .overlay-text {
            position: absolute;
            bottom: 24px;
            color: rgba(255, 182, 193, 0.7);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255, 20, 147, 0.6);
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <canvas id="bouquetCanvas"></canvas>
    <div class="overlay-text">01001100 01001111 01010110 01000101 &bull; CLICK TO BLOOM</div>

    <script>
        const canvas = document.getElementById('bouquetCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBouquet();
        });

        // Pink & Rose Color Palettes
        const rosePalettes = [
            ['#ff007f', '#ff4da6', '#ff99cc', '#ffe6f2'], // Hot Pink to Soft Blush
            ['#e60073', '#ff1a8c', '#ff80bf', '#ffd9ec'], // Deep Magenta to Pastel Pink
            ['#ff3385', '#ff66a3', '#ffb3d1', '#fff0f5'], // Vibrant Rose to Lavender Blush
            ['#c71585', '#ff1493', '#ff69b4', '#ffc0cb'], // Medium Violet Red to Pink
            ['#db2777', '#f43f5e', '#fb7185', '#fecdd3']  // Ruby Rose to Coral Pink
        ];

        const stemColors = ['#2e8b57', '#3cb371', '#66cdaa', '#ff69b4'];
        const ribbonColors = ['#ff1493', '#ff69b4', '#ffb6c1', '#ffffff'];

        let particles = [];
        let floatingParticles = [];
        let mouse = { x: -1000, y: -1000, radius: 90 };
        let time = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        canvas.addEventListener('click', () => {
            // Re-trigger bloom wave and emit binary sparkles
            particles.forEach((p, idx) => {
                p.bloomDelay = (idx % 60) * 0.4;
                p.scale = 0.1;
            });
            for (let i = 0; i < 40; i++) {
                spawnFloatingBit(width / 2 + (Math.random() - 0.5) * 260, height * 0.42 + (Math.random() - 0.5) * 200, true);
            }
        });

        class BinaryBit {
            constructor(targetX, targetY, color, size, type, delay, swayFactor) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.x = width / 2 + (Math.random() - 0.5) * 100;
                this.y = height * 0.85;
                this.color = color;
                this.size = size;
                this.type = type; // 'flower', 'stem', 'leaf', 'ribbon', 'wrap'
                this.char = Math.random() > 0.5 ? '1' : '0';
                this.flipSpeed = 0.015 + Math.random() * 0.03;
                this.flipTimer = Math.random() * 10;
                this.bloomDelay = delay;
                this.scale = 0;
                this.swayFactor = swayFactor;
                this.phase = Math.random() * Math.PI * 2;
                this.vx = 0;
                this.vy = 0;
            }

            update(dt) {
                // Flip 0 and 1 periodically
                this.flipTimer += this.flipSpeed;
                if (this.flipTimer > 1) {
                    this.char = this.char === '1' ? '0' : '1';
                    this.flipTimer = 0;
                }

                // Bloom entrance animation
                if (this.bloomDelay > 0) {
                    this.bloomDelay -= dt * 60;
                    return;
                }
                if (this.scale < 1) {
                    this.scale += (1 - this.scale) * 0.08;
                }

                // Gentle breeze sway anchored around bouquet tie point
                const swayX = Math.sin(time * 1.8 + this.phase * 0.3) * 6 * this.swayFactor;
                const swayY = Math.cos(time * 1.4 + this.phase * 0.3) * 2.5 * this.swayFactor;

                const destX = this.targetX + swayX;
                const destY = this.targetY + swayY;

                // Mouse repulsion interaction
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force * 2.8;
                    this.vy += Math.sin(angle) * force * 2.8;
                }

                // Spring physics back to target position
                this.vx += (destX - this.x) * 0.09;
                this.vy += (destY - this.y) * 0.09;
                this.vx *= 0.82;
                this.vy *= 0.82;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                if (this.scale <= 0.05) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.font = `bold ${this.size}px "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (this.type === 'flower') {
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                } else if (this.type === 'ribbon') {
                    ctx.shadowColor = '#ff1493';
                    ctx.shadowBlur = 6;
                }

                ctx.fillStyle = this.color;
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }
        }

        class FloatingSparkle {
            constructor(x, y, burst = false) {
                this.x = x;
                this.y = y;
                this.char = Math.random() > 0.5 ? '1' : '0';
                this.size = 10 + Math.random() * 8;
                this.vx = burst ? (Math.random() - 0.5) * 4 : (Math.random() - 0.5) * 0.8;
                this.vy = burst ? -1 - Math.random() * 3 : -0.4 - Math.random() * 1.1;
                this.alpha = 1;
                this.decay = burst ? 0.015 + Math.random() * 0.015 : 0.004 + Math.random() * 0.006;
                const colors = ['#ff69b4', '#ffb6c1', '#ff1493', '#ffe4e1'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx + Math.sin(time * 2 + this.y * 0.02) * 0.3;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `bold ${this.size}px "Courier New", monospace`;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fillText(this.char, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnFloatingBit(x, y, burst = false) {
            floatingParticles.push(new FloatingSparkle(x, y, burst));
        }

        // Helper to generate a single Binary Rose using spiral phyllotaxis & rose curve petals
        function createRose(cx, cy, maxRadius, palette, baseDelay, swayFactor) {
            const totalPoints = 135;
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));

            for (let i = 0; i < totalPoints; i++) {
                const t = i / totalPoints;
                const baseAngle = i * goldenAngle;
                // Rose petal modulation
                const petalWave = 1 + 0.24 * Math.sin(5 * baseAngle + t * 6);
                const r = maxRadius * Math.sqrt(t) * petalWave;

                const px = cx + r * Math.cos(baseAngle);
                const py = cy + r * Math.sin(baseAngle) * 0.88; // Slight perspective tilt

                // Color gradient from deep center to bright outer petals
                let color;
                if (t < 0.25) color = palette[0];
                else if (t < 0.55) color = palette[1];
                else if (t < 0.82) color = palette[2];
                else color = palette[3];

                const fontSize = Math.floor(9 + t * 5);
                const delay = baseDelay + t * 25;
                particles.push(new BinaryBit(px, py, color, fontSize, 'flower', delay, swayFactor));
            }
        }

        // Helper to generate curved binary stems
        function createStem(startX, startY, ctrlX, ctrlY, endX, endY, delay, swayFactor) {
            const steps = 32;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                // Quadratic Bezier interpolation
                const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * ctrlX + t * t * endX;
                const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * ctrlY + t * t * endY;

                const color = t > 0.75 ? '#ff69b4' : stemColors[i % 3];
                const currentSway = swayFactor * (1 - t * 0.75);
                particles.push(new BinaryBit(x, y, color, 11, 'stem', delay + (1 - t) * 15, currentSway));

                // Add small binary leaves along the stem
                if (i === 11 || i === 18) {
                    const dir = i === 11 ? -1 : 1;
                    createLeaf(x, y, dir, delay + 10, currentSway);
                }
            }
        }

        // Helper to generate binary leaves
        function createLeaf(ox, oy, dir, delay, swayFactor) {
            const leafPoints = 18;
            for (let i = 1; i <= leafPoints; i++) {
                const t = i / leafPoints;
                const lx = ox + dir * t * 38;
                const spread = Math.sin(t * Math.PI) * 12;
                particles.push(new BinaryBit(lx, oy - spread * 0.6, '#3cb371', 10, 'leaf', delay + i, swayFactor));
                particles.push(new BinaryBit(lx, oy + spread * 0.4, '#66cdaa', 10, 'leaf', delay + i, swayFactor));
            }
        }

        // Helper to generate a pink binary ribbon bow at the bouquet tie point
        function createRibbonBow(cx, cy, scale) {
            // Left and Right Ribbon Loops (Lemniscate / Infinity curve)
            const loopPoints = 90;
            for (let i = 0; i < loopPoints; i++) {
                const t = (i / loopPoints) * Math.PI * 2;
                const denom = 1 + Math.sin(t) * Math.sin(t);
                const rx = cx + (75 * scale * Math.cos(t)) / denom;
                const ry = cy + (42 * scale * Math.sin(t) * Math.cos(t)) / denom;

                const color = ribbonColors[i % ribbonColors.length];
                particles.push(new BinaryBit(rx, ry, color, 12, 'ribbon', 35 + (i % 15), 0.25));
            }

            // Center Knot
            for (let dx = -10; dx <= 10; dx += 6) {
                for (let dy = -8; dy <= 8; dy += 6) {
                    particles.push(new BinaryBit(cx + dx * scale, cy + dy * scale, '#ff1493', 13, 'ribbon', 35, 0.25));
                }
            }

            // Flowing Ribbon Tails
            for (let side of [-1, 1]) {
                for (let i = 0; i < 24; i++) {
                    const t = i / 24;
                    const tx = cx + side * (12 + t * 55 * scale) + Math.sin(t * 4) * 8;
                    const ty = cy + 10 + t * 115 * scale;
                    const color = i % 2 === 0 ? '#ff69b4' : '#ffb6c1';
                    particles.push(new BinaryBit(tx, ty, color, 11, 'ribbon', 40 + i, 0.35 + t * 0.4));
                }
            }
        }

        // Subtle translucent cone wrapper outline made of soft pink binary
        function createBouquetWrap(cx, topY, bottomY, topWidth, bottomWidth) {
            const rows = 14;
            for (let r = 0; r <= rows; r++) {
                const t = r / rows;
                const y = topY + t * (bottomY - topY);
                const halfW = (topWidth * (1 - t) + bottomWidth * t) / 2;

                // Left and right edges of wrapping paper
                particles.push(new BinaryBit(cx - halfW, y, 'rgba(255, 182, 193, 0.45)', 10, 'wrap', 20 + r, 0.3 * (1 - t)));
                particles.push(new BinaryBit(cx + halfW, y, 'rgba(255, 182, 193, 0.45)', 10, 'wrap', 20 + r, 0.3 * (1 - t)));
            }
        }

        function initBouquet() {
            particles = [];
            const cx = width / 2;
            const cy = height * 0.43;
            const scale = Math.min(width, height) / 760;
            const s = Math.max(0.55, Math.min(scale, 1.25));

            const tieX = cx;
            const tieY = cy + 165 * s;
            const bottomY = cy + 265 * s;

            // 9 arranged roses forming a lush dome bouquet
            const flowers = [
                // Back row
                { x: cx - 105 * s, y: cy - 85 * s, r: 44 * s, p: 2, delay: 5, sway: 1.1 },
                { x: cx,           y: cy - 110 * s, r: 48 * s, p: 0, delay: 2, sway: 1.2 },
                { x: cx + 105 * s, y: cy - 85 * s, r: 44 * s, p: 3, delay: 5, sway: 1.1 },
                // Middle row
                { x: cx - 140 * s, y: cy - 10 * s, r: 46 * s, p: 4, delay: 8, sway: 1.0 },
                { x: cx - 52 * s,  y: cy - 30 * s, r: 52 * s, p: 1, delay: 4, sway: 1.05 },
                { x: cx + 52 * s,  y: cy - 30 * s, r: 52 * s, p: 2, delay: 4, sway: 1.05 },
                { x: cx + 140 * s, y: cy - 10 * s, r: 46 * s, p: 0, delay: 8, sway: 1.0 },
                // Front row
                { x: cx - 75 * s,  y: cy + 48 * s, r: 47 * s, p: 3, delay: 12, sway: 0.85 },
                { x: cx,           y: cy + 35 * s, r: 55 * s, p: 0, delay: 10, sway: 0.9 },
                { x: cx + 75 * s,  y: cy + 48 * s, r: 47 * s, p: 4, delay: 12, sway: 0.85 }
            ];

            // Create stems first so flowers render cleanly on top
            flowers.forEach((f) => {
                const spreadBottomX = tieX + (f.x - cx) * 0.22;
                const ctrlX = (f.x + tieX) / 2 + (f.x - cx) * 0.15;
                const ctrlY = (f.y + tieY) / 2;
                createStem(f.x, f.y + 15 * s, ctrlX, ctrlY, spreadBottomX, bottomY, f.delay, f.sway);
            });

            // Create decorative bouquet wrap lines
            createBouquetWrap(cx, cy - 50 * s, bottomY, 370 * s, 75 * s);

            // Create flowers
            flowers.forEach((f) => {
                createRose(f.x, f.y, f.r, rosePalettes[f.p], f.delay, f.sway);
            });

            // Create ribbon bow at tie point
            createRibbonBow(tieX, tieY, s);
        }

        function animate() {
            ctx.fillStyle = 'rgba(13, 2, 8, 0.35)';
            ctx.fillRect(0, 0, width, height);

            time += 0.016;

            // Ambient rising binary sparkles
            if (Math.random() < 0.28) {
                const rx = width / 2 + (Math.random() - 0.5) * 320;
                const ry = height * 0.55 + (Math.random() - 0.5) * 140;
                spawnFloatingBit(rx, ry, false);
            }

            for (let i = floatingParticles.length - 1; i >= 0; i--) {
                const fp = floatingParticles[i];
                fp.update();
                fp.draw();
                if (fp.alpha <= 0) {
                    floatingParticles.splice(i, 1);
                }
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(0.016);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        initBouquet();
        animate();
    </script>
</body>
</html>
